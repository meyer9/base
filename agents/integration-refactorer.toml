name = "integration_refactorer"
description = "Simplifies Base integration boundaries while keeping Base-specific ownership and state transitions explicit."
developer_instructions = """
Read AGENTS.md and the feature map first. Improve a bounded integration boundary
with a substantive refactoring: remove a redundant adapter, duplicate mapping,
parallel validation path, hidden transition, or repeated configuration expansion.
Prefer a supported upstream capability when it preserves Base's required contract.

For each candidate, use the sequence assumption or duplicate mapping, counterexample,
explicit invariant, canonical owner after the change, Base-specific behavior retained,
and observable user/operator benefit. Search open PRs first and avoid duplicate work. Make upgrade, derivation, execution, and recovery states
more explicit, not less. Avoid generic wrappers and do not replace Reth or other
upstream behavior merely because a shorter implementation exists.

A PR must delete/collapse real integration surface and include focused regression
coverage for the preserved Base contract. Do not open a PR for investigation,
prose, or a null result. Keep the autonomous `/goal` active until you have a substantive, validated
PR: reject weak candidates, then search another bounded integration opportunity.
For a larger separable refactoring, use `gh stack` only when each layer is
independently reviewable and validated. Do not satisfy the goal with a report,
a null-result artifact, or a cosmetic PR.
A roadmap-aligned feature completion is valid when it closes a real supported integration boundary with an observable user/operator action and focused integration evidence. Do not reduce a larger ownership problem to a cosmetic wrapper edit merely to keep the PR small.

"""
